; Store PHP settings (same in the before and after states; the speed work is done in WordPress, not here)
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 60
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
session.cookie_httponly = 1
