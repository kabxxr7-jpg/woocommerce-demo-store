# Pear & Porcelain: a fictional WooCommerce demo store.
# Only the web container is published, and only on 127.0.0.1:8081 (the Cloudflare tunnel reaches it there).
name: woo-store

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: store
      MARIADB_USER: store
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]

  wordpress:
    build:
      context: docker/wordpress
    image: woo-store-wordpress:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8081:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: store
      WORDPRESS_DB_USER: store
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: pp_
      WORDPRESS_CONFIG_EXTRA: "require '/var/www/config/wp-config-extra.php';"
      STORE_PUBLIC_HOST: ${STORE_PUBLIC_HOST:-shop.kabiirlabs.com}
      STORE_LOCAL_HOSTS: ${STORE_LOCAL_HOSTS:-127.0.0.1:8081,localhost:8081}
      GTM_ID: ${GTM_ID:-}
      GA4_ID: ${GA4_ID:-}
      # Salts come from .env (generated by scripts/setup.sh), so a rebuild does not log everyone out.
      WORDPRESS_AUTH_KEY: ${WP_AUTH_KEY:?run scripts/setup.sh}
      WORDPRESS_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WP_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WP_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WP_NONCE_SALT}
    volumes:
      - wp_data:/var/www/html
      - ./config:/var/www/config:ro
      - ./wp-content/themes/pear-porcelain:/var/www/html/wp-content/themes/pear-porcelain:ro
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./seed:/seed:ro
      - ./.cache/images:/seed-images:ro
      - ./scripts/wp:/scripts:ro

  # WordPress's own cron fires on page views through a loopback request to the public address, which is
  # unreliable behind a tunnel and slows the visitor who triggers it. This runs due events every minute instead
  # (wp-config sets DISABLE_WP_CRON). It runs the hourly cleanup of visitor test orders, among others.
  cron:
    image: woo-store-wordpress:local
    restart: unless-stopped
    depends_on:
      - wordpress
    user: www-data
    entrypoint: ["bash", "-c", "while true; do wp --path=/var/www/html cron event run --due-now --quiet || true; sleep 60; done"]
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./config:/var/www/config:ro
      - ./wp-content/themes/pear-porcelain:/var/www/html/wp-content/themes/pear-porcelain:ro
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

volumes:
  db_data:
  wp_data:
